name: Check ActualTap OIDC

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test test/sync-failure.test.js test/session-auth.test.js
      - run: docker build -t actualtap-oidc:check .
