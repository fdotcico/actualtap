name: Publish ActualTap OIDC to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-oidc
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'fdotcico/actualtap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test without a live budget
        run: node --test test/sync-failure.test.js test/session-auth.test.js
      - name: Read application version
        id: version
        run: node -e 'const fs = require("fs"); const v = require("./package.json").version; if (!/^\d+\.\d+\.\d+$/.test(v)) throw new Error("Invalid version"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${v}\n`);'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          username: fdotcico
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            fdotcico/actualtap-oidc:latest
            fdotcico/actualtap-oidc:sha-${{ github.sha }}
            fdotcico/actualtap-oidc:${{ steps.version.outputs.version }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/fdotcico/actualtap
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
